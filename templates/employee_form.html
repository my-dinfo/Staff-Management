{% extends "base.html" %}{% block content %}<section class="panel form-panel"><a class="backlink" href="{{ url_for('index') }}">← ဝန်ထမ်းစာရင်း</a><h2>{% if mode=='new' %}ဝန်ထမ်းအသစ် စာရင်းသွင်းရန်{% else %}ဝန်ထမ်းအချက်အလက် ပြင်ဆင်ရန်{% endif %}</h2><p class="muted">ကြယ်ပွင့် (*) ပါသော အချက်အလက်များ မဖြစ်မနေ ဖြည့်ပါ။</p>
<form method="post" class="employee-form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>ဝန်ထမ်းအမှတ် *<input name="employee_code" required value="{{ employee.employee_code }}"></label><label>အမည် *<input name="full_name" required value="{{ employee.full_name }}"></label>
<label>ဌာန<select name="department">{% for d in departments %}<option value="{{ d }}" {% if employee.department==d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select></label><label>ရာထူး *<input name="position" required value="{{ employee.position }}"></label>
<label>ဖုန်း<input name="phone" value="{{ employee.phone }}"></label><label>အီးမေးလ်<input name="email" type="email" value="{{ employee.email }}"></label>
<label>ခန့်အပ်သည့်ရက်<input name="hire_date" type="date" value="{{ employee.hire_date }}"></label><label>အခြေအနေ<select name="status">{% for s in statuses %}<option value="{{ s }}" {% if employee.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label>
<label>မွေးသက္ကရာဇ်<input name="date_of_birth" type="date" value="{{ employee.date_of_birth }}"></label><label>လိင်<select name="gender"><option value="">မရွေးချယ်ရသေး</option>{% for g in ['ကျား','မ','အခြား'] %}<option {% if employee.gender==g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></label>
<label class="full">နေရပ်လိပ်စာ<textarea name="address" rows="2">{{ employee.address }}</textarea></label><label class="full">အရေးပေါ်ဆက်သွယ်ရန်<input name="emergency_contact" value="{{ employee.emergency_contact }}" placeholder="အမည်၊ ဆက်နွယ်မှု၊ ဖုန်း"></label>
<label class="full">မှတ်ချက်<textarea name="notes" rows="3">{{ employee.notes }}</textarea></label><div class="full form-actions"><button class="btn btn-primary">သိမ်းဆည်းမည်</button><a class="btn btn-outline" href="{{ url_for('index') }}">ပယ်ဖျက်မည်</a></div></form></section>{% endblock %}
